<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Access Token 만료 후 상세 처리 흐름</title>
  <desc id="desc">만료된 Access Token으로 보호 API를 요청하면 서버가 TOKEN_EXPIRED를 반환하고, 클라이언트가 Refresh Token으로 두 토큰을 회전한 뒤 원래 요청을 한 번 재시도하는 흐름입니다. 재발급에 실패하면 로그인 화면으로 이동합니다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 30px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .subtitle { font: 500 17px Pretendard, "Noto Sans KR", sans-serif; fill: #52606d; }
      .box-title { font: 700 20px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .body { font: 500 16px Pretendard, "Noto Sans KR", sans-serif; fill: #344054; }
      .small { font: 500 14px Pretendard, "Noto Sans KR", sans-serif; fill: #52606d; }
      .mono { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #344054; }
      .badge { font: 700 15px Pretendard, "Noto Sans KR", sans-serif; fill: #ffffff; }
      .branch { font: 700 15px Pretendard, "Noto Sans KR", sans-serif; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Access Token 만료 후 상세 처리 흐름</text>
  <text x="60" y="89" class="subtitle">만료 응답을 받으면 Refresh Token을 검증하고, 성공할 때만 원래 요청을 한 번 다시 보냅니다.</text>

  <!-- 1. 보호 API 요청 -->
  <rect x="60" y="130" width="300" height="142" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="92" cy="162" r="18" fill="#2563eb"/>
  <text x="92" y="168" text-anchor="middle" class="badge">1</text>
  <text x="122" y="169" class="box-title">보호 API 요청</text>
  <text x="210" y="210" text-anchor="middle" class="mono">Authorization: Bearer ...</text>
  <text x="210" y="242" text-anchor="middle" class="body">만료된 Access Token 전달</text>

  <path d="M 360 201 H 430" class="arrow"/>

  <!-- 2. 만료 응답 -->
  <rect x="450" y="130" width="300" height="142" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="482" cy="162" r="18" fill="#ea580c"/>
  <text x="482" y="168" text-anchor="middle" class="badge">2</text>
  <text x="512" y="169" class="box-title">서버가 만료 확인</text>
  <text x="600" y="210" text-anchor="middle" class="mono">401 TOKEN_EXPIRED</text>
  <text x="600" y="242" text-anchor="middle" class="body">authenticate에서 요청 중단</text>

  <path d="M 750 201 H 820" class="arrow"/>

  <!-- 3. 원래 요청 보류 -->
  <rect x="840" y="130" width="300" height="142" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="872" cy="162" r="18" fill="#7c3aed"/>
  <text x="872" y="168" text-anchor="middle" class="badge">3</text>
  <text x="902" y="169" class="box-title">원래 요청 보류</text>
  <text x="990" y="210" text-anchor="middle" class="body">바로 로그인 화면으로 가지 않고</text>
  <text x="990" y="242" text-anchor="middle" class="body">재발급 결과를 기다림</text>

  <path d="M 990 272 V 330 H 360 V 365" class="arrow"/>

  <!-- 4. 재발급 요청 -->
  <rect x="60" y="380" width="500" height="170" rx="12" fill="#ecfeff" stroke="#22b8cf" stroke-width="2"/>
  <circle cx="92" cy="412" r="18" fill="#0891b2"/>
  <text x="92" y="418" text-anchor="middle" class="badge">4</text>
  <text x="122" y="419" class="box-title">Refresh Token으로 재발급 요청</text>
  <text x="310" y="465" text-anchor="middle" class="mono">POST /api/auth/refresh</text>
  <rect x="112" y="492" width="396" height="38" rx="8" fill="#cffafe" stroke="#67e8f9"/>
  <text x="310" y="517" text-anchor="middle" class="small">브라우저가 HttpOnly 쿠키를 자동으로 포함</text>

  <path d="M 560 465 H 630" class="arrow"/>

  <!-- 5. Refresh 검증 및 회전 -->
  <rect x="650" y="380" width="490" height="170" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <circle cx="682" cy="412" r="18" fill="#16a34a"/>
  <text x="682" y="418" text-anchor="middle" class="badge">5</text>
  <text x="712" y="419" class="box-title">서버가 Session 레코드 검증</text>
  <text x="895" y="462" text-anchor="middle" class="body">Refresh 해시 · 만료 시각 · 사용자 상태</text>
  <text x="895" y="491" text-anchor="middle" class="body">기존 tokenHash가 일치할 때만 조건부 회전</text>
  <text x="895" y="520" text-anchor="middle" class="small">쿠키가 있다는 사실만으로는 성공하지 않습니다.</text>

  <path d="M 895 550 V 608" class="arrow"/>

  <!-- 분기 -->
  <polygon points="895,620 970,666 895,712 820,666" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
  <text x="895" y="660" text-anchor="middle" class="box-title">검증</text>
  <text x="895" y="685" text-anchor="middle" class="body">성공?</text>

  <!-- 성공 경로 -->
  <path d="M 820 666 H 590" class="arrow"/>
  <text x="705" y="650" text-anchor="middle" class="branch" fill="#15803d">성공</text>
  <rect x="300" y="600" width="280" height="132" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="332" cy="632" r="18" fill="#2563eb"/>
  <text x="332" y="638" text-anchor="middle" class="badge">6</text>
  <text x="362" y="639" class="box-title">새 토큰 발급</text>
  <text x="440" y="679" text-anchor="middle" class="body">Access Token → 응답 JSON</text>
  <text x="440" y="707" text-anchor="middle" class="body">Refresh Token → 새 쿠키</text>

  <path d="M 300 666 H 230" class="arrow"/>
  <rect x="60" y="600" width="160" height="132" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <circle cx="92" cy="632" r="18" fill="#16a34a"/>
  <text x="92" y="638" text-anchor="middle" class="badge">7</text>
  <text x="140" y="639" text-anchor="middle" class="box-title">한 번 재시도</text>
  <text x="140" y="679" text-anchor="middle" class="body">보류한 요청</text>
  <text x="140" y="707" text-anchor="middle" class="mono">→ 200 OK</text>

  <!-- 실패 경로 -->
  <path d="M 895 712 V 758" class="arrow"/>
  <text x="918" y="746" class="branch" fill="#dc2626">실패</text>
  <rect x="650" y="772" width="490" height="84" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="895" y="807" text-anchor="middle" class="box-title">재발급 중단</text>
  <text x="895" y="836" text-anchor="middle" class="body">인증 상태 제거 → 로그인 화면으로 이동</text>

  <rect x="60" y="790" width="520" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="320" y="812" text-anchor="middle" class="small">TOKEN_INVALID·UNAUTHORIZED를 무조건 재발급하지 않습니다.</text>
  <text x="320" y="832" text-anchor="middle" class="small">재발급 실패 뒤에는 원래 요청을 반복하지 않습니다.</text>
</svg>
