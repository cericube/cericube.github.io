<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">JWT Access Token의 구조와 서명 및 검증 흐름</title>
  <desc id="desc">Header, Payload, Signature로 구성된 JWT에서 서버가 JWT 내용과 비밀키로 서명을 만들고, 요청을 받으면 서명을 다시 계산해 JWT 안의 서명과 비교하는 흐름</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .label { font: 700 24px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .title { font: 700 30px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .panel-title { font: 700 22px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .body { font: 500 20px Pretendard, "Noto Sans KR", sans-serif; fill: #344054; }
      .small { font: 500 17px Pretendard, "Noto Sans KR", sans-serif; fill: #475467; }
      .mono { font: 700 21px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { font: 700 20px Pretendard, "Noto Sans KR", sans-serif; fill: #344054; }
      .badge { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="64" y="62" class="title">JWT Access Token 한눈에 보기</text>
  <text x="64" y="96" class="small">내용은 읽을 수 있지만, 서버의 서명 없이는 유효한 토큰으로 바꿀 수 없습니다.</text>

  <rect x="64" y="132" width="1072" height="186" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="174" class="label">JWT 구조</text>

  <rect x="92" y="198" width="210" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="197" y="232" text-anchor="middle" class="mono" fill="#1d4ed8">Header</text>
  <text x="197" y="260" text-anchor="middle" class="small">알고리즘 · 타입</text>
  <text x="316" y="248" class="mono" fill="#64748b">.</text>

  <rect x="340" y="198" width="300" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="232" text-anchor="middle" class="mono" fill="#15803d">Payload</text>
  <text x="490" y="260" text-anchor="middle" class="small">sub · email · role · exp</text>
  <text x="654" y="248" class="mono" fill="#64748b">.</text>

  <rect x="678" y="198" width="238" height="80" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="797" y="232" text-anchor="middle" class="mono" fill="#c2410c">Signature</text>
  <text x="797" y="260" text-anchor="middle" class="small">변조 확인용 서명</text>

  <rect x="942" y="198" width="166" height="80" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1025" y="230" text-anchor="middle" class="body" font-weight="700">15분 후 만료</text>
  <text x="1025" y="260" text-anchor="middle" class="small">짧은 유효 시간</text>

  <text x="64" y="370" class="label">Signature는 어떻게 만들고 확인할까요?</text>

  <rect x="64" y="400" width="514" height="328" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="88" y="424" width="74" height="34" rx="17" fill="#2563eb"/>
  <text x="125" y="447" text-anchor="middle" class="badge">Sign</text>
  <text x="178" y="448" class="panel-title">JWT를 발급할 때</text>

  <rect x="108" y="486" width="190" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="203" y="519" text-anchor="middle" class="mono" fill="#15803d">userId=123</text>
  <text x="318" y="520" text-anchor="middle" class="flow-label">+</text>
  <rect x="338" y="486" width="190" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="433" y="519" text-anchor="middle" class="mono" fill="#b91c1c">secretKey</text>

  <path d="M 318 550 V 590" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="178" y="608" width="280" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="318" y="648" text-anchor="middle" class="flow-label" fill="#c2410c">Signature 생성</text>
  <text x="318" y="700" text-anchor="middle" class="small">비밀키는 서버 밖으로 보내지 않습니다.</text>

  <rect x="622" y="400" width="514" height="328" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="646" y="424" width="86" height="34" rx="17" fill="#ea580c"/>
  <text x="689" y="447" text-anchor="middle" class="badge">Verify</text>
  <text x="748" y="448" class="panel-title">나중에 요청이 오면</text>

  <rect x="650" y="480" width="196" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="748" y="513" text-anchor="middle" class="flow-label">받은 JWT 내용</text>
  <text x="866" y="514" text-anchor="middle" class="flow-label">+</text>
  <rect x="886" y="480" width="218" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="995" y="513" text-anchor="middle" class="mono" fill="#b91c1c">secretKey</text>

  <path d="M 879 544 V 574" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="739" y="590" width="280" height="52" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="879" y="623" text-anchor="middle" class="flow-label" fill="#c2410c">Signature 다시 계산</text>

  <path d="M 879 654 V 676" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="879" y="710" text-anchor="middle" class="flow-label">JWT 안의 Signature와 비교</text>

  <rect x="64" y="756" width="1072" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="782" text-anchor="middle" class="small" font-weight="700">실제로는 인코딩된 Header와 Payload 전체를 사용하며, Payload는 암호문이 아닙니다.</text>
</svg>
