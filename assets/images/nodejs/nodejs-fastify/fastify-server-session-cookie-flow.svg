<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">브라우저 HttpOnly Cookie와 Fastify Server Session 흐름</title>
  <desc id="desc">브라우저에는 Session ID만 HttpOnly 쿠키로 저장되고, Fastify가 이 ID로 Redis의 Session 레코드를 조회하여 request.session 객체를 구성하고 로그인 사용자를 확인하는 흐름입니다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 30px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .subtitle { font: 500 17px Pretendard, "Noto Sans KR", sans-serif; fill: #52606d; }
      .box-title { font: 700 21px Pretendard, "Noto Sans KR", sans-serif; fill: #172033; }
      .body { font: 500 17px Pretendard, "Noto Sans KR", sans-serif; fill: #344054; }
      .small { font: 500 15px Pretendard, "Noto Sans KR", sans-serif; fill: #52606d; }
      .mono { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #344054; }
      .badge { font: 700 15px Pretendard, "Noto Sans KR", sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Server Session + HttpOnly Cookie</text>
  <text x="60" y="89" class="subtitle">브라우저는 Session ID만 보관하고, 실제 로그인 상태는 서버의 Session Store가 관리합니다.</text>

  <!-- Browser -->
  <rect x="60" y="140" width="310" height="350" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="98" cy="178" r="20" fill="#2563eb"/>
  <text x="98" y="184" text-anchor="middle" class="badge">1</text>
  <text x="132" y="185" class="box-title">브라우저</text>

  <rect x="92" y="225" width="246" height="104" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="215" y="256" text-anchor="middle" class="body">HttpOnly Cookie</text>
  <text x="215" y="288" text-anchor="middle" class="mono">session_id=abc123</text>
  <text x="215" y="315" text-anchor="middle" class="small">Session ID만 저장</text>

  <rect x="92" y="365" width="246" height="82" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="215" y="397" text-anchor="middle" class="body">JavaScript에서 읽을 수 없음</text>
  <text x="215" y="426" text-anchor="middle" class="small">요청에는 브라우저가 자동 전송</text>

  <!-- Fastify -->
  <rect x="445" y="140" width="310" height="350" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <circle cx="483" cy="178" r="20" fill="#16a34a"/>
  <text x="483" y="184" text-anchor="middle" class="badge">2</text>
  <text x="517" y="185" class="box-title">Fastify</text>

  <rect x="477" y="225" width="246" height="104" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="600" y="256" text-anchor="middle" class="body">Cookie 서명 확인</text>
  <text x="600" y="288" text-anchor="middle" class="body">Session ID로 Store 조회</text>
  <text x="600" y="315" text-anchor="middle" class="small">위조되거나 없는 ID는 인증 실패</text>

  <rect x="477" y="365" width="246" height="82" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="600" y="397" text-anchor="middle" class="mono">request.session</text>
  <text x="600" y="426" text-anchor="middle" class="small">현재 요청에서 사용하는 객체</text>

  <!-- Redis -->
  <rect x="830" y="140" width="310" height="350" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="868" cy="178" r="20" fill="#7c3aed"/>
  <text x="868" y="184" text-anchor="middle" class="badge">3</text>
  <text x="902" y="185" class="box-title">Redis Session Store</text>

  <rect x="862" y="225" width="246" height="104" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="985" y="256" text-anchor="middle" class="mono">abc123</text>
  <text x="985" y="288" text-anchor="middle" class="body">userId=100</text>
  <text x="985" y="315" text-anchor="middle" class="small">expiresAt · role 등</text>

  <rect x="862" y="365" width="246" height="82" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="985" y="397" text-anchor="middle" class="body">실제 로그인 상태</text>
  <text x="985" y="426" text-anchor="middle" class="small">만료·로그아웃 시 삭제</text>

  <!-- 요청 및 조회 화살표 -->
  <path d="M 370 265 H 430" class="arrow"/>
  <text x="400" y="245" text-anchor="middle" class="small">Cookie</text>

  <path d="M 755 265 H 815" class="arrow"/>
  <text x="785" y="245" text-anchor="middle" class="small">조회</text>

  <path d="M 830 415 H 770" class="return"/>
  <text x="800" y="398" text-anchor="middle" class="small">세션 데이터</text>

  <path d="M 445 415 H 385" class="return"/>
  <text x="415" y="398" text-anchor="middle" class="small">응답</text>

  <!-- 하단 핵심 흐름 -->
  <rect x="60" y="545" width="1080" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="580" text-anchor="middle" class="box-title">이후 모든 보호 요청</text>
  <text x="600" y="616" text-anchor="middle" class="body">Session ID 자동 전송 → Store 조회 → userId 확인 → 로그인 사용자로 처리</text>
  <text x="600" y="642" text-anchor="middle" class="small">Access Token · Refresh Token · /refresh · token rotation은 사용하지 않습니다.</text>

  <rect x="60" y="679" width="1080" height="24" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="696" text-anchor="middle" class="small">request.session 객체와 Redis의 Session 레코드는 같은 대상이 아닙니다.</text>
</svg>
