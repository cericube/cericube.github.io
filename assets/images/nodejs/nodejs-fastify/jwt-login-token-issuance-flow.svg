<svg xmlns="http://www.w3.org/2000/svg" width="1786" height="820" viewBox="0 0 1786 820" role="img" aria-labelledby="title desc">
  <title id="title">JWT 로그인 토큰 발급 흐름</title>
  <desc id="desc">로그인 요청과 사용자 검증 뒤 Access Token과 Refresh Token을 생성하고 전달 및 저장하는 과정</desc>
  <defs>
    <linearGradient id="bd" x2="1" y2="1"><stop stop-color="#2875ee"/><stop offset="1" stop-color="#064adf"/></linearGradient>
    <linearGradient id="gd" x2="1" y2="1"><stop stop-color="#27c476"/><stop offset="1" stop-color="#009b55"/></linearGradient>
    <linearGradient id="od" x2="1" y2="1"><stop stop-color="#ff7813"/><stop offset="1" stop-color="#ee4f00"/></linearGradient>
    <linearGradient id="bp" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f3f7ff"/></linearGradient>
    <linearGradient id="gp" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#effcf8"/></linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dy="1" stdDeviation="2" flood-color="#74809a" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1l10 5-10 5z" fill="#46505f"/></marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#101a35}.st{font-size:38px;font-weight:800}.sb{font-size:27px;font-weight:500;fill:#263853}.num{font-size:31px;font-weight:800;fill:#fff}.pt{font-size:45px;font-weight:800}.tag{font-size:25px;font-weight:700}.card{font-size:29px;font-weight:600}.small{font-size:26px;font-weight:600}.foot{font-size:32px;font-weight:700}.arr{stroke:#46505f;stroke-width:6;stroke-linecap:round;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1786" height="820" fill="#fff"/>

  <g filter="url(#soft)"><rect x="74" y="21" width="447" height="182" rx="22" fill="url(#bp)" stroke="#4c8eff" stroke-width="2"/><circle cx="166" cy="74" r="31" fill="url(#bd)"/><text x="166" y="85" text-anchor="middle" class="num">1</text><text x="220" y="88" class="st">1. 로그인 요청</text><text x="298" y="151" text-anchor="middle" class="sb">이메일 + 비밀번호</text></g>
  <path d="M551 103h62" class="arr"/>
  <g filter="url(#soft)"><rect x="648" y="21" width="481" height="182" rx="22" fill="url(#gp)" stroke="#67d3ad" stroke-width="2"/><circle cx="763" cy="74" r="31" fill="url(#gd)"/><text x="763" y="85" text-anchor="middle" class="num">2</text><text x="815" y="88" class="st">2. 사용자 검증</text><text x="889" y="143" text-anchor="middle" class="sb">사용자 조회 · 비밀번호 확인 ·</text><text x="889" y="178" text-anchor="middle" class="sb">ACTIVE 상태 확인</text></g>
  <path d="M1159 103h62" class="arr"/>
  <g filter="url(#soft)"><rect x="1256" y="21" width="438" height="182" rx="22" fill="#fff9f2" stroke="#ff710f" stroke-width="2"/><circle cx="1369" cy="74" r="31" fill="url(#od)"/><text x="1369" y="85" text-anchor="middle" class="num">3</text><text x="1419" y="88" class="st">3. 토큰 생성</text><text x="1475" y="153" text-anchor="middle" class="sb">Access JWT + Refresh Token</text></g>

  <g filter="url(#soft)">
    <rect x="42" y="242" width="831" height="425" rx="22" fill="url(#bp)" stroke="#1360e7" stroke-width="3"/>
    <path d="M90 276c28 17 52 16 78 0v43c0 25-15 43-39 52-24-9-39-27-39-52z" fill="#1760de"/><rect x="113" y="310" width="32" height="30" rx="5" fill="#fff"/><path d="M119 310v-7a10 10 0 0120 0v7" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="207" y="325" class="pt" fill="#1258ce">Access Token</text><rect x="530" y="282" width="272" height="57" rx="21" fill="#eef4ff" stroke="#a8c7ff" stroke-width="2"/><text x="666" y="320" text-anchor="middle" class="tag" fill="#185cc4">짧게 사용하는 JWT</text>
    <rect x="92" y="380" width="219" height="147" rx="21" fill="#fff" stroke="#82adff" stroke-width="2"/><circle cx="201" cy="413" r="15" fill="#1e62dc"/><path d="M174 451c2-21 53-21 55 0z" fill="#1e62dc"/><text x="201" y="490" text-anchor="middle" class="card">사용자 정보</text>
    <path d="M323 448h38" class="arr"/><rect x="370" y="380" width="200" height="147" rx="21" fill="#fff" stroke="#82adff" stroke-width="2"/><circle cx="483" cy="414" r="18" fill="none" stroke="#1e62dc" stroke-width="10"/><path d="M469 428l-29 29m8-8l10 10m0-20l10 10" stroke="#1e62dc" stroke-width="10" stroke-linecap="round"/><text x="470" y="490" text-anchor="middle" class="card">JWT 서명</text>
    <path d="M582 448h38" class="arr"/><rect x="629" y="380" width="194" height="147" rx="21" fill="#fff" stroke="#82adff" stroke-width="2"/><circle cx="726" cy="424" r="26" fill="none" stroke="#1e62dc" stroke-width="5"/><path d="M726 408v19h16" fill="none" stroke="#1e62dc" stroke-width="5" stroke-linecap="round"/><text x="726" y="490" text-anchor="middle" class="card">15분</text>
    <path d="M80 554h755" stroke="#d8dce4" stroke-width="2"/><rect x="94" y="570" width="405" height="69" rx="18" fill="#eef4ff" stroke="#bbd2ff" stroke-width="2"/><path d="M132 588h23l11 11v25h-34zm23 0v12h11m-27 6h18m-18 8h14" fill="none" stroke="#4b8cf0" stroke-width="4"/><text x="191" y="615" class="small" fill="#1558bd">응답 본문(JSON)으로 전달</text>
    <rect x="530" y="570" width="287" height="69" rx="18" fill="#eef4ff" stroke="#bbd2ff" stroke-width="2"/><ellipse cx="580" cy="594" rx="17" ry="7" fill="#4b8cf0"/><path d="M563 594v22c0 9 34 9 34 0v-22" fill="#4b8cf0" opacity=".8"/><circle cx="596" cy="614" r="12" fill="#fff" stroke="#b22984" stroke-width="3"/><path d="M588 606l16 16" stroke="#b22984" stroke-width="3"/><text x="623" y="615" class="small" fill="#1558bd">DB 저장 안 함</text>
  </g>

  <g filter="url(#soft)">
    <rect x="912" y="242" width="833" height="425" rx="22" fill="url(#gp)" stroke="#087a6e" stroke-width="3"/>
    <path d="M958 276c28 17 52 16 78 0v43c0 25-15 43-39 52-24-9-39-27-39-52z" fill="#008675"/><path d="M1016 309a22 22 0 10-4 25m4-25v-14m0 14h-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="1067" y="325" class="pt" fill="#007b6c">Refresh Token</text><rect x="1402" y="282" width="251" height="57" rx="21" fill="#effbf8" stroke="#a9e5d8" stroke-width="2"/><text x="1527" y="320" text-anchor="middle" class="tag" fill="#08786c">오래 사용하는 토큰</text>
    <rect x="947" y="380" width="196" height="149" rx="21" fill="#fff" stroke="#81d8c7" stroke-width="2"/><path d="M1024 408l21-12 21 12v26l-21 12-21-12zm0 0l21 12 21-12m-21 12v26" fill="none" stroke="#087d70" stroke-width="3"/><circle cx="1035" cy="410" r="3" fill="#087d70"/><circle cx="1055" cy="409" r="3" fill="#087d70"/><circle cx="1035" cy="429" r="3" fill="#087d70"/><text x="1045" y="480" text-anchor="middle" class="card">48바이트</text><text x="1045" y="515" text-anchor="middle" class="card">난수 생성</text>
    <path d="M1154 448h38" class="arr"/><rect x="1208" y="380" width="206" height="149" rx="21" fill="#fff" stroke="#81d8c7" stroke-width="2"/><path d="M1311 404c-25-1-36 20-29 40m29-30c-15 0-21 12-18 28m18-18c-7 0-9 8-8 17m8-38c27 0 37 25 25 47m-25-26c13 0 14 16 8 28m-8-39c20 0 26 19 19 34m-35 24c10-5 14-12 12-23" fill="none" stroke="#087d70" stroke-width="4" stroke-linecap="round"/><text x="1311" y="480" text-anchor="middle" class="card">SHA-256</text><text x="1311" y="515" text-anchor="middle" class="card">해시</text>
    <path d="M1426 448h38" class="arr"/><rect x="1477" y="380" width="227" height="149" rx="21" fill="#fff" stroke="#81d8c7" stroke-width="2"/><ellipse cx="1591" cy="408" rx="24" ry="10" fill="#087d70"/><path d="M1567 408v34c0 13 48 13 48 0v-34m-48 17c0 13 48 13 48 0" fill="#087d70" opacity=".9"/><text x="1591" y="480" text-anchor="middle" class="card">sessions</text><text x="1591" y="515" text-anchor="middle" class="card">테이블 저장</text>
    <rect x="947" y="570" width="756" height="69" rx="18" fill="#effbf8" stroke="#b5e8dd" stroke-width="2"/><path d="M1088 587a18 18 0 1023 25c-11 1-17-8-13-18-5 1-9-2-10-7z" fill="none" stroke="#087d70" stroke-width="4"/><circle cx="1084" cy="608" r="3" fill="#087d70"/><circle cx="1096" cy="620" r="3" fill="#087d70"/><circle cx="1077" cy="619" r="3" fill="#087d70"/><text x="1127" y="615" class="small">원문은 HttpOnly 쿠키로 전달 (7일)</text>
  </g>

  <g filter="url(#soft)"><rect x="42" y="700" width="1702" height="107" rx="21" fill="#faf8ff" stroke="#c6bbe9" stroke-width="2"/><rect x="229" y="730" width="49" height="55" rx="5" fill="none" stroke="#6742b5" stroke-width="5"/><rect x="241" y="722" width="25" height="14" rx="5" fill="#6742b5"/><path d="M241 756l8 8 16-18" fill="none" stroke="#6742b5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="770" class="foot">Access Token은 응답 본문으로, Refresh Token 원문은 쿠키로, 해시는 DB에 저장</text></g>
</svg>
