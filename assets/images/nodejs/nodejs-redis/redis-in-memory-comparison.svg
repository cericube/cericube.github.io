<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">일반 데이터베이스와 Redis의 데이터 읽기 경로 비교</title>
  <desc id="description">일반 데이터베이스는 버퍼 캐시 적중 시 메모리에서 응답하지만, 캐시 미적중 시 디스크 입출력이 발생할 수 있습니다. Redis는 RAM을 주 저장 공간으로 사용해 데이터를 메모리에서 바로 읽어 반환합니다.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      .heading { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #64748b; }
      .card-title { font-size: 23px; font-weight: 800; }
      .card-subtitle { font-size: 15px; font-weight: 600; }
      .box-title { font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-copy { font-size: 14px; font-weight: 500; fill: #475569; }
      .badge { font-size: 13px; font-weight: 700; }
      .summary-title { font-size: 16px; font-weight: 800; }
      .summary-copy { font-size: 14px; font-weight: 500; fill: #334155; }
      .footnote { font-size: 13px; font-weight: 500; fill: #64748b; }
      .flow-label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>

  <text x="600" y="52" text-anchor="middle" class="heading">데이터를 읽는 경로가 응답 속도를 좌우합니다</text>
  <text x="600" y="82" text-anchor="middle" class="subtitle">일반 DB는 버퍼 캐시를 활용하고, Redis는 RAM을 주 저장 공간으로 사용합니다.</text>

  <!-- 일반 데이터베이스 -->
  <g filter="url(#shadow)">
    <rect x="50" y="116" width="535" height="476" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="50" y="116" width="535" height="72" rx="22" fill="#eff6ff"/>
  <path d="M50 166V138Q50 116 72 116H563Q585 116 585 138V188H50Z" fill="#eff6ff"/>
  <circle cx="86" cy="152" r="17" fill="#2563eb"/>
  <path d="M78 145h16v13H78zM81 142h10v3H81zM81 158h10v3H81z" fill="#ffffff"/>
  <text x="116" y="149" class="card-title" fill="#1d4ed8">일반 데이터베이스</text>
  <text x="116" y="172" class="card-subtitle" fill="#3b82f6">디스크 기반 저장 + 메모리 버퍼 캐시</text>

  <rect x="80" y="216" width="116" height="62" rx="13" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="138" y="242" text-anchor="middle" class="box-title">앱 서버</text>
  <text x="138" y="262" text-anchor="middle" class="box-copy">데이터 요청</text>

  <line x1="196" y1="247" x2="247" y2="247" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

  <rect x="258" y="207" width="142" height="80" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="329" y="239" text-anchor="middle" class="box-title">DBMS</text>
  <text x="329" y="262" text-anchor="middle" class="box-copy">쿼리 처리</text>

  <line x1="400" y1="247" x2="449" y2="247" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="425" y="232" text-anchor="middle" class="flow-label" fill="#2563eb">확인</text>

  <rect x="460" y="207" width="94" height="80" rx="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="507" y="239" text-anchor="middle" class="box-title">버퍼</text>
  <text x="507" y="262" text-anchor="middle" class="box-copy">캐시</text>

  <path d="M507 287V324H400" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="258" y="306" width="142" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="329" y="330" text-anchor="middle" class="badge" fill="#1d4ed8">캐시 적중</text>
  <text x="329" y="350" text-anchor="middle" class="box-copy">메모리에서 응답</text>

  <path d="M507 287V394" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="517" y="344" class="flow-label" fill="#c2410c">캐시 미적중</text>
  <rect x="441" y="405" width="126" height="70" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <ellipse cx="504" cy="425" rx="38" ry="10" fill="#fed7aa" stroke="#ea580c"/>
  <path d="M466 425v25c0 6 17 11 38 11s38-5 38-11v-25" fill="#ffedd5" stroke="#ea580c"/>
  <text x="504" y="451" text-anchor="middle" class="box-title" fill="#9a3412">디스크</text>

  <path d="M441 440H329V371" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-slate)"/>
  <text x="379" y="431" text-anchor="middle" class="flow-label" fill="#c2410c">I/O 후 캐시에 적재</text>

  <rect x="80" y="503" width="475" height="61" rx="13" fill="#fff7ed"/>
  <circle cx="106" cy="533" r="10" fill="#f97316"/>
  <text x="106" y="538" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
  <text x="128" y="528" class="summary-title" fill="#9a3412">디스크 I/O가 생길 수 있는 경로</text>
  <text x="128" y="549" class="summary-copy">캐시 미적중 또는 변경 내용 반영 시 지연 가능</text>

  <!-- Redis -->
  <g filter="url(#shadow)">
    <rect x="615" y="116" width="535" height="476" rx="22" fill="#ffffff" stroke="#a7f3d0"/>
  </g>
  <rect x="615" y="116" width="535" height="72" rx="22" fill="#ecfdf5"/>
  <path d="M615 166V138Q615 116 637 116H1128Q1150 116 1150 138V188H615Z" fill="#ecfdf5"/>
  <circle cx="651" cy="152" r="17" fill="#dc2626"/>
  <path d="M641 147l10-5 10 5-10 5zM641 153l10 5 10-5M641 158l10 5 10-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <text x="681" y="149" class="card-title" fill="#047857">Redis</text>
  <text x="681" y="172" class="card-subtitle" fill="#059669">RAM 중심의 인메모리 데이터 저장소</text>

  <rect x="645" y="216" width="116" height="62" rx="13" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="703" y="242" text-anchor="middle" class="box-title">앱 서버</text>
  <text x="703" y="262" text-anchor="middle" class="box-copy">데이터 요청</text>

  <line x1="761" y1="247" x2="817" y2="247" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="789" y="232" text-anchor="middle" class="flow-label" fill="#047857">명령</text>

  <rect x="828" y="207" width="142" height="80" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="899" y="239" text-anchor="middle" class="box-title">Redis</text>
  <text x="899" y="262" text-anchor="middle" class="box-copy">명령 처리</text>

  <line x1="970" y1="247" x2="1020" y2="247" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="995" y="232" text-anchor="middle" class="flow-label" fill="#047857">접근</text>

  <rect x="1031" y="207" width="89" height="80" rx="13" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="1048" y="225" width="55" height="12" rx="3" fill="#059669" opacity="0.85"/>
  <rect x="1048" y="242" width="55" height="12" rx="3" fill="#10b981" opacity="0.75"/>
  <text x="1075" y="274" text-anchor="middle" class="box-title">RAM</text>

  <path d="M1075 287V334H899V296" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="828" y="319" width="142" height="56" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="899" y="343" text-anchor="middle" class="badge" fill="#047857">데이터 조회</text>
  <text x="899" y="363" text-anchor="middle" class="box-copy">메모리에서 처리</text>

  <path d="M828 347H704V287" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="766" y="337" text-anchor="middle" class="flow-label" fill="#047857">바로 반환</text>

  <rect x="645" y="405" width="475" height="70" rx="13" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="669" y="432" class="summary-title" fill="#0f766e">요청의 주 처리 경로</text>
  <text x="669" y="456" class="summary-copy">Key와 Value를 RAM에서 읽고 쓰므로 빠른 응답에 유리</text>

  <rect x="645" y="503" width="475" height="61" rx="13" fill="#ecfdf5"/>
  <circle cx="671" cy="533" r="10" fill="#10b981"/>
  <path d="M666 533l4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="693" y="528" class="summary-title" fill="#047857">짧고 단순한 데이터 접근 경로</text>
  <text x="693" y="549" class="summary-copy">디스크 탐색 없이 메모리에서 주요 연산 수행</text>

  <!-- 핵심 비교 및 주의 문구 -->
  <rect x="50" y="620" width="1100" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="76" y="649" class="summary-title" fill="#334155">핵심 차이</text>
  <text x="166" y="649" class="summary-copy">일반 DB는 디스크가 영구 저장의 중심이고, Redis는 빠르게 사용할 데이터를 RAM에 둡니다.</text>
  <text x="600" y="698" text-anchor="middle" class="footnote">개념도 · 실제 응답 시간은 저장 장치, 네트워크, 쿼리, 데이터 크기와 서버 부하에 따라 달라집니다.</text>
</svg>
