<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">일반 데이터베이스와 Redis의 데이터 처리 흐름 비교</title>
  <desc id="description">일반 데이터베이스는 애플리케이션과 데이터베이스 서버를 거쳐 디스크에 접근할 수 있지만, Redis는 메모리에서 데이터를 바로 반환하는 흐름을 보여 줍니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 24px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #1f2937; }
      .label { font: 600 22px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #1f2937; }
      .small { font: 500 18px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #374151; }
      .note { font: 500 17px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #4b5563; }
      .arrow { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="120" y="48" class="title">일반 데이터베이스</text>

  <rect x="80" y="80" width="190" height="76" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="175" y="126" text-anchor="middle" class="label">클라이언트</text>

  <path d="M270 118 H350" class="arrow"/>

  <rect x="360" y="80" width="170" height="76" class="box" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="445" y="126" text-anchor="middle" class="label">앱 서버</text>

  <path d="M530 118 H610" class="arrow"/>

  <rect x="620" y="80" width="190" height="76" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="715" y="112" text-anchor="middle" class="label">DB 서버</text>
  <text x="715" y="140" text-anchor="middle" class="small">쿼리 실행</text>

  <path d="M810 118 H890" class="arrow"/>

  <rect x="900" y="80" width="190" height="76" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="995" y="112" text-anchor="middle" class="label">디스크</text>
  <text x="995" y="140" text-anchor="middle" class="small">I/O 발생 가능</text>

  <text x="80" y="190" class="note">디스크 I/O가 발생하면 응답 시간이 늘어날 수 있습니다.</text>

  <line x1="70" y1="230" x2="1130" y2="230" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 10"/>

  <text x="120" y="278" class="title">Redis(인메모리)</text>

  <rect x="80" y="310" width="190" height="76" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="175" y="356" text-anchor="middle" class="label">클라이언트</text>

  <path d="M270 348 H350" class="arrow"/>

  <rect x="360" y="310" width="170" height="76" class="box" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="445" y="356" text-anchor="middle" class="label">앱 서버</text>

  <path d="M530 348 H610" class="arrow"/>

  <rect x="620" y="310" width="230" height="76" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="735" y="342" text-anchor="middle" class="label">Redis</text>
  <text x="735" y="370" text-anchor="middle" class="small">RAM에서 바로 반환</text>

  <text x="80" y="420" class="note">주요 데이터를 메모리에서 읽으므로 빠른 응답에 유리합니다.</text>

  <rect x="80" y="458" width="480" height="70" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="320" y="488" text-anchor="middle" class="small">디스크: 저장 장치와 I/O 상황에 따라 지연 발생</text>
  <text x="320" y="514" text-anchor="middle" class="note">HDD는 헤드 이동에 따른 기계적 지연도 있습니다.</text>

  <rect x="600" y="458" width="510" height="70" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="855" y="488" text-anchor="middle" class="small">RAM: 디스크보다 짧은 접근 시간</text>
  <text x="855" y="514" text-anchor="middle" class="note">실제 응답 시간은 환경과 작업량에 따라 달라집니다.</text>
</svg>
