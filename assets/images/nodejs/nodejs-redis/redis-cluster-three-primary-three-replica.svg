<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">3개의 Primary와 3개의 Replica로 구성한 Redis Cluster</title>
  <desc id="desc">Hash Slot을 나누어 담당하는 Primary 세 개와 각 Primary에 연결된 Replica 한 개씩을 보여 주는 Redis Cluster 구성도</desc>

  <rect width="1200" height="720" fill="#ffffff"/>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
    <text x="600" y="70" fill="#111827" font-size="40" font-weight="700" text-anchor="middle">
      Redis Cluster 구성
    </text>
    <text x="600" y="110" fill="#6b7280" font-size="22" text-anchor="middle">
      3 Primary + 3 Replica
    </text>

    <rect x="445" y="150" width="310" height="76" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="600" y="198" fill="#1d4ed8" font-size="28" font-weight="700" text-anchor="middle">
      Redis Cluster
    </text>

    <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M600 228v45H230v42"/>
      <path d="M600 228v87"/>
      <path d="M600 273h370v42"/>
      <path d="M220 305l10 10 10-10"/>
      <path d="M590 305l10 10 10-10"/>
      <path d="M960 305l10 10 10-10"/>
    </g>

    <g>
      <rect x="80" y="325" width="300" height="128" rx="18" fill="#2563eb"/>
      <rect x="450" y="325" width="300" height="128" rx="18" fill="#2563eb"/>
      <rect x="820" y="325" width="300" height="128" rx="18" fill="#2563eb"/>

      <g fill="#ffffff" text-anchor="middle">
        <text x="230" y="375" font-size="28" font-weight="700">Primary 1</text>
        <text x="600" y="375" font-size="28" font-weight="700">Primary 2</text>
        <text x="970" y="375" font-size="28" font-weight="700">Primary 3</text>
        <text x="230" y="416" font-size="21">Hash Slot 일부 담당</text>
        <text x="600" y="416" font-size="21">Hash Slot 일부 담당</text>
        <text x="970" y="416" font-size="21">Hash Slot 일부 담당</text>
      </g>
    </g>

    <g stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M230 455v65m-10-10 10 10 10-10"/>
      <path d="M600 455v65m-10-10 10 10 10-10"/>
      <path d="M970 455v65m-10-10 10 10 10-10"/>
    </g>

    <g fill="#ffffff" stroke="#9ca3af" stroke-width="3">
      <rect x="80" y="530" width="300" height="110" rx="18"/>
      <rect x="450" y="530" width="300" height="110" rx="18"/>
      <rect x="820" y="530" width="300" height="110" rx="18"/>
    </g>

    <g fill="#374151" text-anchor="middle">
      <text x="230" y="578" font-size="27" font-weight="700">Replica 1</text>
      <text x="600" y="578" font-size="27" font-weight="700">Replica 2</text>
      <text x="970" y="578" font-size="27" font-weight="700">Replica 3</text>
      <text x="230" y="613" font-size="20">Primary 1 데이터 복제</text>
      <text x="600" y="613" font-size="20">Primary 2 데이터 복제</text>
      <text x="970" y="613" font-size="20">Primary 3 데이터 복제</text>
    </g>

    <text x="600" y="686" fill="#6b7280" font-size="21" text-anchor="middle">
      Primary마다 Replica 하나를 연결해 데이터 복제와 Failover를 준비합니다.
    </text>
  </g>
</svg>
