---
layout: default
---
<section class="list-page">
  {% assign recent_posts = site.posts | slice: 0, 100 %}
  <div class="list-toolbar">
    <h1><span class="list-icon">☷</span> <span id="listTitle">최신 글 목록</span> <small id="postCount">({{ recent_posts.size }})</small></h1>
  </div>
  <div id="postList" class="post-list">
    {% for post in recent_posts %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>
  <p id="emptyMessage" class="empty-message" hidden>해당 카테고리에 등록된 글이 없습니다.</p>
</section>
