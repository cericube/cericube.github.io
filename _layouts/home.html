---
layout: default
---
<section class="list-page">
  <div class="list-toolbar">
    <h1><span class="list-icon">☷</span> <span id="listTitle">전체 글 목록</span> <small id="postCount">({{ site.posts.size }})</small></h1>
    <select id="sortPosts" aria-label="글 정렬">
      <option value="newest">최신순</option>
      <option value="oldest">오래된순</option>
    </select>
  </div>
  <div id="postList" class="post-list">
    {% for post in site.posts %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>
  <p id="emptyMessage" class="empty-message" hidden>해당 카테고리에 등록된 글이 없습니다.</p>
</section>
